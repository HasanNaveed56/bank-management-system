<!DOCTYPE html>
<html>
<head>
  <title>ATM Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
    }

    .atm-card {
      background: #111827;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    .sidebar {
      background: #1f2937;
      height: 100vh;
      padding: 20px;
      border-radius: 0 20px 20px 0;
    }

    .btn-atm {
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 12px;
    }

    .balance-box {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      padding: 20px;
      border-radius: 20px;
    }

    input {
      border-radius: 10px !important;
    }

    .toast {
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="container-fluid">

  <div class="row">

    <!-- LEFT SIDEBAR (ATM MENU) -->
    <div class="col-md-3 sidebar">

      <h4>🏧 Hasan Bank ATM</h4>
      <hr>

      <a href="#deposit" class="btn btn-success btn-atm">💰 Deposit</a>
      <a href="#withdraw" class="btn btn-danger btn-atm">🏧 Withdraw</a>
      <a href="#transfer" class="btn btn-primary btn-atm">💸 Transfer</a>
      <a href="/logout" class="btn btn-dark btn-atm">🚪 Logout</a>

    </div>

    <!-- MAIN DASHBOARD -->
    <div class="col-md-9 p-4">

      <!-- TOAST -->
      <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        {% if toast %}
        <div class="toast show text-bg-success">
          <div class="toast-body">
            {{ toast }}
          </div>
        </div>
        {% endif %}
      </div>

      <!-- TOP BALANCE CARD -->
      <div class="atm-card balance-box mb-4">
        <h5>Current Balance</h5>
        <h1>${{ user["balance"] }}</h1>
        <p>Account: {{ user["acc_no"] }}</p>
      </div>

      <div class="row">

        <!-- DEPOSIT -->
        <div class="col-md-4" id="deposit">
          <div class="atm-card">
            <h5>💰 Deposit</h5>
            <form method="POST" action="/deposit">
              <input name="amount" class="form-control mb-2" placeholder="Enter amount" required>
              <button class="btn btn-success w-100">Deposit</button>
            </form>
          </div>
        </div>

        <!-- WITHDRAW -->
        <div class="col-md-4" id="withdraw">
          <div class="atm-card">
            <h5>🏧 Withdraw</h5>
            <form method="POST" action="/withdraw">
              <input name="amount" class="form-control mb-2" placeholder="Enter amount" required>
              <button class="btn btn-danger w-100">Withdraw</button>
            </form>
          </div>
        </div>

        <!-- TRANSFER -->
        <div class="col-md-4" id="transfer">
          <div class="atm-card">
            <h5>💸 Transfer</h5>
            <form method="POST" action="/transfer">
              <input name="to_acc" class="form-control mb-2" placeholder="Receiver Account" required>
              <input name="amount" class="form-control mb-2" placeholder="Amount" required>
              <button class="btn btn-primary w-100">Send</button>
            </form>
          </div>
        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
